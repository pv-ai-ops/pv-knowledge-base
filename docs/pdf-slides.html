<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>PDF 幻灯片预览</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: rgba(255, 255, 255, 0.92);
        --panel-border: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: rgba(15, 23, 42, 0.6);
        --primary: #06b6d4;
        --danger: #ef4444;
        --shadow: 0 10px 32px rgba(15, 23, 42, 0.12);
        --radius: 14px;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(1200px 800px at 20% 10%, rgba(6, 182, 212, 0.12), transparent 55%),
          radial-gradient(900px 700px at 85% 20%, rgba(99, 102, 241, 0.1), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Sans", "Liberation Sans", sans-serif;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
      }

      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .toolbar {
        position: relative;
        display: grid;
        grid-template-columns: 1fr minmax(0, 1.4fr) 1fr;
        gap: 12px;
        padding: 12px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow);
        z-index: 10;
      }

      .toolbar .group {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .toolbar .group.center {
        justify-content: center;
      }

      .doc-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        color: var(--text);
      }

      .page-info {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      .btn {
        appearance: none;
        border: 1px solid rgba(15, 23, 42, 0.14);
        background: rgba(255, 255, 255, 0.7);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
        user-select: none;
        font-size: 13px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.92);
        border-color: rgba(15, 23, 42, 0.22);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .btn.primary {
        border-color: rgba(6, 182, 212, 0.5);
      }

      .btn.primary:hover {
        border-color: rgba(6, 182, 212, 0.75);
      }

      .btn.icon {
        padding: 8px 10px;
        min-width: 42px;
        justify-content: center;
      }

      .viewer {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 10px 18px 10px;
        min-height: 0;
      }

      .canvas-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: var(--radius);
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.16);
        max-width: 100%;
        max-height: 100%;
      }

      .message {
        position: absolute;
        inset: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 18px;
        border-radius: var(--radius);
        border: 1px dashed rgba(148, 163, 184, 0.35);
        color: var(--muted);
        line-height: 1.5;
        background: rgba(255, 255, 255, 0.76);
      }

      .message strong {
        color: var(--text);
      }

      .progress {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 10px;
        height: 4px;
        background: rgba(148, 163, 184, 0.16);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress > div {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, rgba(6, 182, 212, 0.9), rgba(99, 102, 241, 0.85));
        border-radius: 999px;
        transition: width 160ms ease;
      }

      .hint {
        font-size: 12px;
        color: rgba(229, 231, 235, 0.68);
        margin-top: 10px;
      }

      .kbd {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.35);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
        font-size: 12px;
        color: var(--text);
        margin: 0 2px;
      }

      @media (max-width: 720px) {
        .toolbar {
          grid-template-columns: 1fr 1fr;
          grid-template-areas:
            "left right"
            "center center";
        }
        .toolbar .group.left {
          grid-area: left;
        }
        .toolbar .group.right {
          grid-area: right;
          justify-content: flex-end;
        }
        .toolbar .group.center {
          grid-area: center;
        }
        .btn.label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="toolbar" role="toolbar" aria-label="PDF 幻灯片工具栏">
        <div class="group left">
          <button class="btn icon" id="back" type="button" title="返回文章">
            <span aria-hidden="true">⨯</span>
          </button>
          <button class="btn icon" id="prev" type="button" title="上一页 (← / PageUp)">
            <span aria-hidden="true">←</span>
          </button>
          <button class="btn icon" id="next" type="button" title="下一页 (→ / Space / PageDown)">
            <span aria-hidden="true">→</span>
          </button>
          <div class="page-info" id="pageInfo">— / —</div>
        </div>

        <div class="group center">
          <div class="doc-title" id="docTitle">PDF 幻灯片预览</div>
        </div>

        <div class="group right" style="justify-content: flex-end">
          <a class="btn primary" id="download" href="#" target="_blank" rel="noopener" title="下载 PDF">
            <span aria-hidden="true">⬇</span>
            <span class="btn label">下载</span>
          </a>
          <button class="btn" id="fullscreen" type="button" title="全屏 (F)">
            <span aria-hidden="true">⛶</span>
            <span class="btn label">全屏</span>
          </button>
        </div>
      </div>

      <div class="viewer" id="viewer">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas" aria-label="PDF 页面画布"></canvas>
          <div class="message" id="message" role="status" aria-live="polite" style="display: none"></div>
        </div>
        <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
      </div>
    </div>

    <noscript>
      <div style="padding: 16px; color: #fff">此预览器需要启用 JavaScript。</div>
    </noscript>

    <script src="assets/pdfjs/pdf.min.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const fileParam = params.get("file");
        const titleParam = params.get("title");
        const initialPageParam = Number(params.get("page") || "") || null;
        const refParam = params.get("ref");

        const canvas = document.getElementById("canvas");
        const canvasWrap = document.getElementById("canvasWrap");
        const message = document.getElementById("message");
        const pageInfo = document.getElementById("pageInfo");
        const docTitle = document.getElementById("docTitle");
        const progressBar = document.getElementById("progressBar");
        const backBtn = document.getElementById("back");
        const prevBtn = document.getElementById("prev");
        const nextBtn = document.getElementById("next");
        const fullscreenBtn = document.getElementById("fullscreen");
        const downloadLink = document.getElementById("download");

        const viewer = document.getElementById("viewer");

        const isFramed = (() => {
          try {
            return window.top !== window.self;
          } catch (e) {
            return true;
          }
        })();

        const resolvedRefUrl = (() => {
          if (!refParam) return null;
          try {
            return new URL(refParam, window.location.href).toString();
          } catch (e) {
            return null;
          }
        })();

        function showMessage(html, { isError = false } = {}) {
          message.style.display = "flex";
          message.style.borderColor = isError ? "rgba(239, 68, 68, 0.55)" : "rgba(148, 163, 184, 0.35)";
          message.innerHTML = html;
        }

        function hideMessage() {
          message.style.display = "none";
          message.textContent = "";
        }

        if (!fileParam) {
          showMessage(
            `<div><strong>缺少参数</strong><div class="hint">请使用 <span class="kbd">?file=assets/xxx.pdf</span> 打开。</div></div>`,
            { isError: true }
          );
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          fullscreenBtn.disabled = true;
          return;
        }

        function navigateBack() {
          const baseUrl = new URL(".", window.location.href).toString();
          const sameOriginReferrer = (() => {
            if (!document.referrer) return null;
            try {
              const ref = new URL(document.referrer);
              if (ref.origin !== window.location.origin) return null;
              return ref.toString();
            } catch (e) {
              return null;
            }
          })();

          const target = resolvedRefUrl || sameOriginReferrer || baseUrl;

          if (document.fullscreenElement) {
            try {
              document.exitFullscreen();
            } catch (e) {
              // ignore
            }
          }

          if (isFramed) {
            window.open(target, "_blank", "noopener");
            return;
          }

          if (window.history.length > 1 && !resolvedRefUrl) {
            window.history.back();
            return;
          }
          window.location.href = target;
        }

        backBtn.addEventListener("click", navigateBack);

        const fileUrl = new URL(fileParam, window.location.href).toString();
        downloadLink.href = fileUrl;

        const displayTitle = titleParam ? titleParam : null;
        if (displayTitle) {
          docTitle.textContent = displayTitle;
          document.title = displayTitle;
        }

        if (!window.pdfjsLib) {
          showMessage(`<div><strong>PDF 预览器资源缺失</strong><div class="hint">请确认已发布 pdf.js 资源。</div></div>`, {
            isError: true
          });
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "assets/pdfjs/pdf.worker.min.js";

        let pdfDoc = null;
        let currentPage = 1;
        let renderTask = null;
        let renderToken = 0;

        function clampPage(page) {
          if (!pdfDoc) return 1;
          return Math.min(Math.max(1, page), pdfDoc.numPages);
        }

        function updateControls() {
          if (!pdfDoc) {
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = "— / —";
            progressBar.style.width = "0%";
            return;
          }
          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = currentPage >= pdfDoc.numPages;
          pageInfo.textContent = `${currentPage} / ${pdfDoc.numPages}`;
          progressBar.style.width = `${(currentPage / pdfDoc.numPages) * 100}%`;
        }

        async function renderPage(pageNumber) {
          if (!pdfDoc) return;
          const pageIndex = clampPage(pageNumber);
          currentPage = pageIndex;
          updateControls();

          const myToken = ++renderToken;
          if (renderTask && typeof renderTask.cancel === "function") {
            try {
              renderTask.cancel();
            } catch (e) {
              // ignore
            }
          }

          const page = await pdfDoc.getPage(pageIndex);

          const baseViewport = page.getViewport({ scale: 1 });
          const paddingFactor = 1;
          const containerWidth = canvasWrap.clientWidth;
          const containerHeight = canvasWrap.clientHeight;
          const scale = Math.min(containerWidth / baseViewport.width, containerHeight / baseViewport.height) * paddingFactor;

          const dpr = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: scale * dpr });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          canvas.style.width = `${Math.floor(viewport.width / dpr)}px`;
          canvas.style.height = `${Math.floor(viewport.height / dpr)}px`;

          const ctx = canvas.getContext("2d", { alpha: false });
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";

          hideMessage();

          try {
            renderTask = page.render({ canvasContext: ctx, viewport });
            await renderTask.promise;
            if (myToken !== renderToken) return;
          } catch (error) {
            if (error && error.name === "RenderingCancelledException") return;
            showMessage(
              `<div><strong>渲染失败</strong><div class="hint">${String(error && error.message ? error.message : error)}</div></div>`,
              { isError: true }
            );
          }
        }

        function go(delta) {
          if (!pdfDoc) return;
          const next = clampPage(currentPage + delta);
          if (next !== currentPage) {
            renderPage(next);
          }
        }

        prevBtn.addEventListener("click", () => go(-1));
        nextBtn.addEventListener("click", () => go(1));

        async function toggleFullscreen() {
          try {
            if (!document.fullscreenElement) {
              await document.documentElement.requestFullscreen();
            } else {
              await document.exitFullscreen();
            }
          } catch (e) {
            // ignore
          }
        }

        fullscreenBtn.addEventListener("click", toggleFullscreen);

        document.addEventListener("fullscreenchange", () => {
          window.setTimeout(() => renderPage(currentPage), 60);
        });

        window.addEventListener(
          "keydown",
          event => {
            if (!pdfDoc) return;
            if (event.defaultPrevented) return;

            const key = event.key;
            const isTypingTarget =
              event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA" || event.target.isContentEditable);
            if (isTypingTarget) return;

            if (key === "ArrowRight" || key === "PageDown" || key === " ") {
              event.preventDefault();
              go(1);
              return;
            }
            if (key === "ArrowLeft" || key === "PageUp") {
              event.preventDefault();
              go(-1);
              return;
            }
            if (key === "Home") {
              event.preventDefault();
              renderPage(1);
              return;
            }
            if (key === "End") {
              event.preventDefault();
              renderPage(pdfDoc.numPages);
              return;
            }
            if (key === "f" || key === "F") {
              event.preventDefault();
              toggleFullscreen();
            }
          },
          { passive: false }
        );

        // Mobile swipe navigation
        let touchStartX = null;
        let touchStartY = null;
        viewer.addEventListener(
          "touchstart",
          event => {
            if (!event.touches || event.touches.length !== 1) return;
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
          },
          { passive: true }
        );
        viewer.addEventListener(
          "touchend",
          event => {
            if (touchStartX == null || touchStartY == null) return;
            const changed = event.changedTouches && event.changedTouches[0];
            if (!changed) return;
            const dx = changed.clientX - touchStartX;
            const dy = changed.clientY - touchStartY;
            touchStartX = null;
            touchStartY = null;

            if (Math.abs(dx) < 56 || Math.abs(dy) > 80) return;
            if (dx < 0) go(1);
            else go(-1);
          },
          { passive: true }
        );

        let resizeTimer = null;
        window.addEventListener("resize", () => {
          if (!pdfDoc) return;
          if (resizeTimer) window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => renderPage(currentPage), 120);
        });

        showMessage(
          `<div><strong>正在加载 PDF…</strong><div class="hint">支持：<span class="kbd">←</span><span class="kbd">→</span><span class="kbd">Space</span> 翻页，<span class="kbd">F</span> 全屏。</div></div>`
        );

        const loadingTask = window.pdfjsLib.getDocument({
          url: fileUrl,
          cMapUrl: "assets/pdfjs/cmaps/",
          cMapPacked: true,
          standardFontDataUrl: "assets/pdfjs/standard_fonts/"
        });
        loadingTask.promise
          .then(doc => {
            pdfDoc = doc;
            const desiredPage = initialPageParam ? clampPage(initialPageParam) : 1;
            renderPage(desiredPage);
          })
          .catch(error => {
            showMessage(
              `<div><strong>加载失败</strong><div class="hint">${String(error && error.message ? error.message : error)}</div></div>`,
              { isError: true }
            );
            prevBtn.disabled = true;
            nextBtn.disabled = true;
          })
          .finally(() => {
            updateControls();
          });
      })();
    </script>
  </body>
</html>
